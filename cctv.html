<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV 線上直播</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            background-color: #1a1a1a;
            color: #fff;
        }
        /* 左側選單 */
        .sidebar {
            width: 250px;
            background-color: #2d2d2d;
            overflow-y: auto;
            border-right: 1px solid #444;
        }
        .sidebar h2 {
            padding: 20px;
            font-size: 1.2rem;
            text-align: center;
            background-color: #ff3333;
            color: white;
        }
        .channel-btn {
            display: block;
            width: 100%;
            padding: 15px 20px;
            background: none;
            border: none;
            color: #ddd;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            border-bottom: 1px solid #3d3d3d;
            transition: background 0.2s;
        }
        .channel-btn:hover {
            background-color: #3d3d3d;
            color: #fff;
        }
        .channel-btn.active {
            background-color: #ff3333;
            color: #fff;
            font-weight: bold;
        }
        /* 右側播放區 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #111;
        }
        .video-container {
            flex: 1;
            position: relative;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- 左側頻道選擇 -->
    <div class="sidebar">
        <h2>CCTV 直播源</h2>
        <button class="channel-btn active" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=11200132825562653886')">CCTV1 綜合</button>
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=12030532124776958103')">CCTV2 財經</button>
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=10620168294224708952')">CCTV4 中文國際</button>
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=8516529981177953694')">CCTV7 國防軍事</button>
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=7252237247689203957')">CCTV9 紀錄</button>
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=14589146016461298119')">CCTV10 科教</button>
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=13180385922471124325')">CCTV12 社會與法</button>
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=16265686808730585228')">CCTV13 新聞</button>
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=4496917190172866934')">CCTV17 農業農村</button>
        <button class="channel-btn" onclick="changeChannel(this, 'https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=2127841942201075403')">CCTV4K 超高清</button>
    </div>

    <!-- 右側播放區域 -->
    <div class="main-content">
        <div class="video-container">
            <iframe id="live-player" src="https://m-live.cctvnews.cctv.com/live/landscape.html?liveRoomNumber=11200132825562653886" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        function changeChannel(button, url) {
            // 切換播放源路徑
            document.getElementById('live-player').src = url;
            
            // 移除其他按鈕的 active 狀態
            const buttons = document.querySelectorAll('.channel-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            // 為當前點擊的按鈕加入 active 狀態
            button.classList.add('active');
        }
    </script>
</body>
</html>
